# spot-cluster.yaml

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1

managedNodeGroups:
- name: spot
  instanceTypes: ["c5.large","c5d.large","c5n.large","c5a.large"]
# instanceTypes: ["c5.large", "c5d.large", "c5a.large", "t3.medium", "m5.large"]
  spot: true
  desiredCapacity: 2